<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" width="300" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEE2E2"/>
      <stop offset="100%" style="stop-color:#FECACA"/>
    </linearGradient>
  </defs>
  <rect width="300" height="160" fill="url(#bg)"/>
  <circle cx="268" cy="18" r="46" fill="#FCA5A5" opacity="0.35"/>
  <circle cx="22" cy="148" r="30" fill="#F87171" opacity="0.25"/>
  <!-- Coffee cup -->
  <g transform="translate(115,20)">
    <!-- Cup body -->
    <rect x="10" y="20" width="50" height="55" rx="4" fill="#DC2626" opacity="0.9"/>
    <!-- Cup rim -->
    <rect x="6" y="16" width="58" height="10" rx="3" fill="#B91C1C"/>
    <!-- Handle -->
    <path d="M60,35 Q80,35 80,50 Q80,65 60,65" fill="none" stroke="#B91C1C" stroke-width="7" stroke-linecap="round"/>
    <!-- Steam lines -->
    <path d="M22,10 Q25,4 22,0" fill="none" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
    <path d="M35,12 Q38,5 35,0" fill="none" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
    <path d="M48,10 Q51,4 48,0" fill="none" stroke="#F87171" stroke-width="3" stroke-linecap="round"/>
    <!-- Saucer -->
    <ellipse cx="35" cy="78" rx="40" ry="7" fill="#FCA5A5"/>
    <!-- JAVA label on cup -->
    <text x="35" y="53" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">JAVA</text>
  </g>
  <!-- Bottom label -->
  <text x="150" y="148" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#7F1D1D" text-anchor="middle" opacity="0.7">JAVA</text>
</svg>

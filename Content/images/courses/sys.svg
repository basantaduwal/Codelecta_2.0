    <rect x="-5" y="-34" width="10" height="14" rx="2" fill="#475569"/>
    <rect x="-5" y="20" width="10" height="14" rx="2" fill="#475569"/>
    <rect x="-34" y="-5" width="14" height="10" rx="2" fill="#475569"/>
    <rect x="20" y="-5" width="14" height="10" rx="2" fill="#475569"/>
    <rect x="-28" y="-28" width="10" height="10" rx="2" fill="#475569" transform="rotate(45,-23,-23)"/>
    <rect x="18" y="-28" width="10" height="10" rx="2" fill="#475569" transform="rotate(45,23,-23)"/>
    <rect x="-28" y="18" width="10" height="10" rx="2" fill="#475569" transform="rotate(45,-23,23)"/>

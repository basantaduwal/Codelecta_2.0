      <stop offset="0%" style="stop-color:#FEF08A"/>
      <stop offset="100%" style="stop-color:#FDE047"/>
    </linearGradient>
  </defs>
  <rect width="300" height="160" fill="url(#bg)"/>
  <circle cx="270" cy="20" r="50" fill="#FACC15" opacity="0.35"/>
  <circle cx="20" cy="150" r="35" fill="#EAB308" opacity="0.25"/>

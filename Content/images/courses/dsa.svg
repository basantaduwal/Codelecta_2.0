<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" width="300" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D1FAE5"/>
      <stop offset="100%" style="stop-color:#A7F3D0"/>
    </linearGradient>
  </defs>
  <rect width="300" height="160" fill="url(#bg)"/>
  <circle cx="268" cy="18" r="45" fill="#6EE7B7" opacity="0.35"/>
  <circle cx="22" cy="146" r="30" fill="#34D399" opacity="0.25"/>
  <!-- Binary tree -->
  <g transform="translate(80,18)" stroke="#059669" stroke-width="2.5" fill="none">
    <!-- Edges -->
    <line x1="70" y1="22" x2="35" y2="55"/>
    <line x1="70" y1="22" x2="105" y2="55"/>
    <line x1="35" y1="67" x2="18" y2="98"/>
    <line x1="35" y1="67" x2="52" y2="98"/>
    <line x1="105" y1="67" x2="88" y2="98"/>
    <line x1="105" y1="67" x2="122" y2="98"/>
    <!-- Nodes -->
    <circle cx="70" cy="18" r="14" fill="#059669" stroke="none"/>
    <circle cx="35" cy="61" r="12" fill="#10B981" stroke="none"/>
    <circle cx="105" cy="61" r="12" fill="#10B981" stroke="none"/>
    <circle cx="18" cy="102" r="10" fill="#34D399" stroke="none"/>
    <circle cx="52" cy="102" r="10" fill="#34D399" stroke="none"/>
    <circle cx="88" cy="102" r="10" fill="#34D399" stroke="none"/>
    <circle cx="122" cy="102" r="10" fill="#34D399" stroke="none"/>
    <!-- Node labels -->
    <text x="70" y="23" font-family="monospace" font-size="11" font-weight="700" fill="white" text-anchor="middle">1</text>
    <text x="35" y="65" font-family="monospace" font-size="11" font-weight="700" fill="white" text-anchor="middle">2</text>
    <text x="105" y="65" font-family="monospace" font-size="11" font-weight="700" fill="white" text-anchor="middle">3</text>
  </g>
  <!-- Label -->
  <text x="150" y="148" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#064E3B" text-anchor="middle" opacity="0.7">DATA STRUCTURES &amp; ALGORITHMS</text>
</svg>
